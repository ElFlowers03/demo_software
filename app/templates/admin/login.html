{% extends "base.html" %}

{% block title %}Login - Panel Administrativo{% endblock %}

{% block content %}
<div class="container">
    <div class="login-container">
        <!-- Header -->
        <div class="login-header">
            <div class="login-icon">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="fw-bold text-primary-custom">Panel Administrativo</h2>
            <p class="text-muted">Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Formulario de Login -->
        <form action="{{ url_for('admin.login_post') }}" method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Usuario</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" class="form-control" name="usuario" 
                           placeholder="Ingresa tu usuario" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-bold">Contraseña</label>
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" class="form-control" name="password" 
                           id="password" placeholder="Ingresa tu contraseña" required>
                    <button class="btn btn-outline-secondary" type="button" 
                            onclick="togglePassword()">
                        <i class="fas fa-eye" id="toggleIcon"></i>
                    </button>
                </div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary-custom btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </button>
            </div>
        </form>

        <!-- Información de Demo -->
        <div class="mt-4 p-3 bg-primary-custom-light rounded">
            <p class="mb-2 text-center">
                <i class="fas fa-info-circle me-2 text-primary-custom"></i>
                <strong>Credenciales de Demo</strong>
            </p>
            <p class="mb-0 text-center small text-muted">
                Usuario: <strong>admin</strong> | Contraseña: <strong>admin123</strong>
            </p>
        </div>

        <!-- Volver al inicio -->
        <div class="text-center mt-3">
            <a href="{{ url_for('home.index') }}" class="text-decoration-none">
                <i class="fas fa-arrow-left me-1"></i>Volver al Inicio
            </a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.classList.remove('fa-eye');
        toggleIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        toggleIcon.classList.remove('fa-eye-slash');
        toggleIcon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
